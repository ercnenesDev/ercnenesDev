<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C16"/>
      <stop offset="50%" stop-color="#0E1424"/>
      <stop offset="100%" stop-color="#0A101D"/>
    </linearGradient>

    <!-- Card 1: Redoubt Amber Glow -->
    <linearGradient id="redoubtBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Card 2: CRM-MLS Cyan Glow -->
    <linearGradient id="crmBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Subtle Dot Grid -->
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" opacity="0.35"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .pulse-dot { animation: pulse 2s ease-in-out infinite alternate; }
    @keyframes pulse { 0% { opacity: 0.4; } 100% { opacity: 1; } }

    .tag-hover { transition: transform 0.2s; }
  </style>

  <!-- Base Canvas -->
  <rect width="900" height="260" rx="14" fill="url(#bg)"/>
  <rect width="900" height="260" rx="14" fill="url(#dotGrid)"/>
  <rect width="898" height="258" x="1" y="1" rx="13" fill="none" stroke="#1E293B" stroke-width="1.2"/>

  <!-- Ambient Light Orbs -->
  <circle cx="120" cy="50" r="90" fill="#F59E0B" opacity="0.08" filter="url(#glow)"/>
  <circle cx="780" cy="50" r="90" fill="#38BDF8" opacity="0.08" filter="url(#glow)"/>

  <!-- ================= TOP: DEVELOPER IDENTITY ================= -->
  <!-- Top Category Label -->
  <text x="36" y="34" font-size="11" font-weight="700" fill="#64748B" letter-spacing="1.2">PORTFOLIO // CORE ARCHITECT</text>

  <!-- Full Name -->
  <text x="34" y="68" font-size="34" font-weight="900" fill="url(#nameGrad)" letter-spacing="-0.5">Yusuf Enes Ercan</text>

  <!-- Tagline -->
  <text x="36" y="90" font-size="13.5" font-weight="500" fill="#94A3B8">Game Systems Architect (Unity &amp; C#) · Full-Stack Engineer (.NET 8 &amp; React)</text>

  <!-- Status Badge (Top Right) -->
  <g transform="translate(686, 38)">
    <rect width="178" height="28" rx="14" fill="#0F172A" stroke="#10B981" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="14" cy="14" r="4" fill="#10B981" class="pulse-dot"/>
    <text x="26" y="18" font-size="11" font-weight="700" fill="#34D399" letter-spacing="0.5">OPEN TO WORK</text>
  </g>

  <!-- Divider -->
  <line x1="36" y1="104" x2="864" y2="104" stroke="#1E293B" stroke-width="1"/>

  <!-- ================= BOTTOM: DUAL REPO SHOWCASE ================= -->

  <!-- CARD 1: REDOUBT -->
  <g transform="translate(36, 116)">
    <!-- Container -->
    <rect width="406" height="126" rx="10" fill="#0C1322" stroke="url(#redoubtBorder)" stroke-width="1.2"/>

    <!-- Header & Badge -->
    <text x="18" y="27" font-size="15" font-weight="800" fill="#F59E0B" letter-spacing="0.5">🏰 REDOUBT</text>
    
    <g transform="translate(136, 13)">
      <rect width="138" height="20" rx="10" fill="#241B0A" stroke="#F59E0B" stroke-width="0.8" stroke-opacity="0.6"/>
      <text x="10" y="14" font-size="10" font-weight="700" fill="#FBBF24" letter-spacing="0.4">UNITY · C# · RPG</text>
    </g>

    <!-- Project Description -->
    <text x="18" y="54" font-size="12" font-weight="600" fill="#F1F5F9">Kingdom Strategy &amp; Hero Collection RPG</text>
    <text x="18" y="72" font-size="11" font-weight="400" fill="#94A3B8">Decoupled pure C# domain core with deterministic combat</text>

    <!-- Bottom Feature / Metric Pill -->
    <g transform="translate(18, 88)">
      <rect width="370" height="24" rx="5" fill="#171207" stroke="#F59E0B" stroke-opacity="0.25"/>
      <circle cx="12" cy="12" r="3.5" fill="#10B981"/>
      <text x="22" y="16" font-size="10.5" font-weight="700" fill="#10B981">198 Unit Tests Verified</text>
      <text x="160" y="16" font-size="10.5" font-weight="500" fill="#FBBF24">· Web Simulation Engine</text>
    </g>
  </g>

  <!-- CARD 2: ARABA CRM-MLS -->
  <g transform="translate(458, 116)">
    <!-- Container -->
    <rect width="406" height="126" rx="10" fill="#0A1424" stroke="url(#crmBorder)" stroke-width="1.2"/>

    <!-- Header & Badge -->
    <text x="18" y="27" font-size="15" font-weight="800" fill="#38BDF8" letter-spacing="0.5">🚗 ARABA CRM-MLS</text>

    <g transform="translate(186, 13)">
      <rect width="144" height="20" rx="10" fill="#0A223B" stroke="#38BDF8" stroke-width="0.8" stroke-opacity="0.6"/>
      <text x="10" y="14" font-size="10" font-weight="700" fill="#7DD3FC" letter-spacing="0.4">REACT · NODE · MLS</text>
    </g>

    <!-- Project Description -->
    <text x="18" y="54" font-size="12" font-weight="600" fill="#F1F5F9">Dealership CRM &amp; Multi-Listing System</text>
    <text x="18" y="72" font-size="11" font-weight="400" fill="#94A3B8">Vehicle inventory pipeline, customer tracking &amp; MLS pool</text>

    <!-- Bottom Feature / Metric Pill -->
    <g transform="translate(18, 88)">
      <rect width="370" height="24" rx="5" fill="#08182B" stroke="#38BDF8" stroke-opacity="0.25"/>
      <circle cx="12" cy="12" r="3.5" fill="#38BDF8"/>
      <text x="22" y="16" font-size="10.5" font-weight="700" fill="#38BDF8">Full-Stack Architecture</text>
      <text x="156" y="16" font-size="10.5" font-weight="500" fill="#93C5FD">· Dealership Inventory Sync</text>
    </g>
  </g>
</svg>
